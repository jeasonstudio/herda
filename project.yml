name: herda

options:
  bundleIdPrefix: app.herda
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  HerdaKit:
    # Static library rather than a framework: embedding a framework inside an
    # xctest bundle fails code signing ("bundle format unrecognized"). Static
    # linking keeps the logic testable without a host app.
    type: library.static
    platform: macOS
    sources:
      - path: Sources/HerdaKit

  Herda:
    type: application
    platform: macOS
    sources:
      - path: Sources/Herda
    dependencies:
      - target: HerdaKit
    info:
      path: Sources/Herda/Info.plist
      properties:
        CFBundleName: Herda
        CFBundleDisplayName: Herda
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.herda

  HerdaKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HerdaKitTests
    dependencies:
      - target: HerdaKit
    settings:
      base:
        # xcodegen does not synthesise one for test bundles, and code signing
        # refuses to run without it.
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Herda:
    build:
      targets:
        Herda: all
        HerdaKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HerdaKitTests
