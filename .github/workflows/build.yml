name: build

on:
  push:
    branches: [main]
  # Lets you re-run the build without pushing — the only way to iterate on this
  # workflow itself without landing commits on main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write, not read: the nightly release step creates a tag and a release.
  contents: write

jobs:
  build:
    # macos-26's default toolchain is Xcode 26.6 (17F113), which matches the
    # toolchain this project is developed against. Swift 6 strict-concurrency
    # diagnostics differ between Xcode releases, so the version is pinned below
    # rather than left to the image default: if the image drops 26.6, this
    # should fail loudly instead of silently building with a different compiler.
    runs-on: macos-26
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      DERIVED_DATA: build

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version
          swift --version

      # The .xcodeproj is generated, not committed, so nothing can be built
      # until xcodegen has run.
      - name: Install xcodegen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Generate project
        run: xcodegen generate

      # Not Scripts/test.sh. It gates correctly — it reads xcodebuild's status
      # out of PIPESTATUS, so a failing suite exits 65 — but its grep keeps only
      # the lines worth reading in a terminal. xcbeautify's github-actions
      # renderer instead annotates a failure onto the diff, which is the whole
      # value of running it here.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project macos-client.xcodeproj \
            -scheme HerdrPrototype \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            | xcbeautify --renderer github-actions

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project macos-client.xcodeproj \
            -scheme HerdrPrototype \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            | xcbeautify --renderer github-actions

      # actions/upload-artifact zips its input, but loses the executable bit and
      # symlinks inside a .app, producing a bundle that will not launch. ditto
      # writes a macOS-correct archive first.
      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA/Build/Products/Release/HerdrPrototype.app" \
            HerdrPrototype.zip

      # Kept alongside the release below, and not redundant with it: the release
      # only ever holds the newest build, while these stay per-commit for 90
      # days, which is what you want when bisecting a regression.
      - uses: actions/upload-artifact@v4
        with:
          name: HerdrPrototype-${{ github.sha }}
          path: HerdrPrototype.zip
          if-no-files-found: error

      # One rolling `nightly` release rather than one per commit: the tag list
      # stays clean and the download URL is stable, so docs can link
      # .../releases/download/nightly/HerdrPrototype.zip. The cost is that
      # older nightlies are gone — recover those from the artifacts above.
      #
      # Marked --prerelease so it never becomes the repo's "Latest" release.
      # That slot stays empty until the first tagged version ships.
      #
      # Guarded on main because workflow_dispatch can be run from any branch,
      # and a nightly built off a side branch would be misleading.
      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # printf rather than a heredoc: heredoc bodies keep this block's YAML
          # indentation, and four leading spaces turn every line into a markdown
          # code block.
          {
            printf 'Automated build of `%s` — %s\n\n' \
              "${GITHUB_SHA:0:7}" "$(git log -1 --pretty=%s)"
            printf 'Ad-hoc signed and not notarized, so Gatekeeper refuses to open it after\n'
            printf 'download. Clear the quarantine attribute first:\n\n'
            printf '    xattr -dr com.apple.quarantine HerdrPrototype.app\n\n'
            printf 'Launching it also needs a `herdr` binary, looked up in the app bundle,\n'
            printf 'then PATH, then ~/.local/bin/herdr.\n'
          } > notes.md

          # delete-then-create leaves a few seconds with no nightly release.
          # Avoiding that means force-pushing the tag and branching on whether
          # the release already exists; for a dev build the gap is not worth the
          # extra shell. --cleanup-tag drops the tag too, so create can re-point
          # it at this commit.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:7})" \
            --notes-file notes.md \
            HerdrPrototype.zip
